name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
  packages: write # earth layer cache lives in ghcr.io/<repo>/earth-cache
env:
  FORCE_COLOR: 1
jobs:
  test:
    runs-on: ubuntu-latest
    # A newer push supersedes a running test build.
    concurrency:
      group: ci-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: earthbuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        with:
          version: v0.8.19
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: earth --ci --push --remote-cache=ghcr.io/${{ github.repository }}/earth-cache:test --max-remote-cache +test
  verify:
    # Lean/Aeneas pipeline. Slow (mathlib) and not yet proven to pass; does not gate merges.
    # Runs against upstream Aeneas and the gilescope fork so the two can be compared.
    runs-on: ubuntu-latest
    continue-on-error: true
    # Queue rather than cancel: a cancelled leg throws away the Aeneas build it was about to cache.
    concurrency:
      group: ci-verify-${{ github.ref }}-${{ matrix.aeneas.rev }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        aeneas:
          - { repo: AeneasVerif/aeneas, rev: 0d21a9ec7bbbb110110cacc14464a47fd71c8705, tarball: "" }
          # the fork publishes static binaries: no nix build, minutes instead of a quarter hour
          - { repo: gilescope/aeneas,   rev: 7a8e1114293e89615bff16e23edd0593221c7495, tarball: "https://github.com/gilescope/aeneas/releases/download/build-7a8e111/aeneas-linux-x86_64.tar.gz" }
          # the GAT-lite branch, built with nix: +probe-gat is the acceptance test for it
          - { repo: gilescope/aeneas,   rev: a0486ab239709efda672f7b4abb3116a38854879, tarball: "" }
    env:
      # One cache image per Aeneas revision: the nix build and the mathlib fetch are layers in it,
      # so a second run against the same revision skips both. --push writes the cache; nothing
      # in the Earthfile is itself pushed.
      EARTH_ARGS: >-
        --ci --push --max-remote-cache
        --remote-cache=ghcr.io/${{ github.repository }}/earth-cache:verify-${{ matrix.aeneas.rev }}
        --AENEAS_REPO=${{ matrix.aeneas.repo }}
        --AENEAS_REV=${{ matrix.aeneas.rev }}
        --AENEAS_TARBALL_URL=${{ matrix.aeneas.tarball }}
    steps:
      - uses: actions/checkout@v4
      - uses: earthbuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        with:
          version: v0.8.19
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: earth $EARTH_ARGS +probe
      - run: earth $EARTH_ARGS +probe-gat
        continue-on-error: true
      - run: earth $EARTH_ARGS +verify
