name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
  packages: write # earth layer cache lives in ghcr.io/<repo>/earth-cache
env:
  FORCE_COLOR: 1
jobs:
  test:
    runs-on: ubuntu-latest
    # A newer push supersedes a running test build.
    concurrency:
      group: ci-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: earthbuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        with:
          version: v0.8.19
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # Default cache is 10% of the root disk (~7GB): the nix build of Aeneas alone exceeds that,
      # so every earth invocation in a job was rebuilding it from scratch.
      - run: earth config global.cache_size_mb 30000
      - run: earth --ci --push --remote-cache=ghcr.io/${{ github.repository }}/earth-cache:test --max-remote-cache +test
  verify:
    # Lean/Aeneas pipeline. Slow (mathlib) and not yet proven to pass; does not gate merges.
    # Runs against upstream Aeneas and the gilescope fork so the two can be compared.
    runs-on: ubuntu-latest
    continue-on-error: true
    # Queue rather than cancel: a cancelled leg throws away the Aeneas build it was about to cache.
    concurrency:
      group: ci-verify-${{ github.ref }}-${{ matrix.aeneas.rev }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        aeneas:
          # upstream main, from its nightly release tarball (no nix build anywhere in the matrix)
          - { repo: AeneasVerif/aeneas, rev: 1dc8ad31b1b062a77c50e29144a6c7bba955fa09, tarball: "https://github.com/AeneasVerif/aeneas/releases/download/nightly-2026.11.15-1dc8ad3/aeneas-linux-x86_64.tar.gz" }
          # the fork publishes static binaries: no nix build, minutes instead of a quarter hour
          - { repo: gilescope/aeneas,   rev: 7a8e1114293e89615bff16e23edd0593221c7495, tarball: "https://github.com/gilescope/aeneas/releases/download/build-7a8e111/aeneas-linux-x86_64.tar.gz" }
          # the GAT-lite branch (release/gat-lite = gat-lite b2a7475 merged + release workflow): +probe-gat is its acceptance test
          - { repo: gilescope/aeneas,   rev: 74561b75ce1e198502fa6f9e88463ddd6dab80ff, tarball: "https://github.com/gilescope/aeneas/releases/download/build-74561b7/aeneas-linux-x86_64.tar.gz" }
    env:
      # One cache image per Aeneas revision: the nix build and the mathlib fetch are layers in it,
      # so a second run against the same revision skips both. --push writes the cache; nothing
      # in the Earthfile is itself pushed.
      # One cache tag per target and Aeneas revision. A tag holds the layers of the last build
      # that exported to it, so sharing one across the four targets made each export evict the
      # previous target's layers (verify then rebuilt Mathlib and the backend every run).
      EARTH_FLAGS: --ci --push --max-remote-cache
      CACHE: ghcr.io/${{ github.repository }}/earth-cache
      REV: ${{ matrix.aeneas.rev }}
      # build args go after the target
      BUILD_ARGS: >-
        --AENEAS_REPO=${{ matrix.aeneas.repo }}
        --AENEAS_REV=${{ matrix.aeneas.rev }}
        --AENEAS_TARBALL_URL=${{ matrix.aeneas.tarball }}
    steps:
      - uses: actions/checkout@v4
      - uses: earthbuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        with:
          version: v0.8.19
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # Default cache is 10% of the root disk (~7GB): the nix build of Aeneas alone exceeds that,
      # so every earth invocation in a job was rebuilding it from scratch.
      - run: earth config global.cache_size_mb 30000
      - run: earth $EARTH_FLAGS --remote-cache=$CACHE:probe-$REV +probe $BUILD_ARGS
      - run: earth $EARTH_FLAGS --remote-cache=$CACHE:probe-gat-$REV +probe-gat $BUILD_ARGS
        continue-on-error: true
      - run: earth $EARTH_FLAGS --remote-cache=$CACHE:fork-test-gat-$REV +fork-test-gat $BUILD_ARGS
        continue-on-error: true
      - run: earth $EARTH_FLAGS --remote-cache=$CACHE:verify-$REV +verify $BUILD_ARGS
