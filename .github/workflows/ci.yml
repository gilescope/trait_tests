name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: earthbuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        with:
          version: v0.8.19
      - run: earth --ci +test
  verify:
    # Lean/Aeneas pipeline. Slow (mathlib) and not yet proven to pass; does not gate merges.
    # Runs against upstream Aeneas and the gilescope fork so the two can be compared.
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        aeneas:
          - { repo: AeneasVerif/aeneas, rev: 0d21a9ec7bbbb110110cacc14464a47fd71c8705, tarball: "" }
          # the fork publishes static binaries: no nix build, minutes instead of a quarter hour
          - { repo: gilescope/aeneas,   rev: 7a8e1114293e89615bff16e23edd0593221c7495, tarball: "https://github.com/gilescope/aeneas/releases/download/build-7a8e111/aeneas-linux-x86_64.tar.gz" }
          # the GAT-lite branch, built with nix: +probe-gat is the acceptance test for it
          - { repo: gilescope/aeneas,   rev: c6e28da47e149af20332387c946a0d372d2da255, tarball: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: earthbuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        with:
          version: v0.8.19
      - run: earth --ci +probe --AENEAS_REPO=${{ matrix.aeneas.repo }} --AENEAS_REV=${{ matrix.aeneas.rev }} --AENEAS_TARBALL_URL=${{ matrix.aeneas.tarball }}
      - run: earth --ci +probe-gat --AENEAS_REPO=${{ matrix.aeneas.repo }} --AENEAS_REV=${{ matrix.aeneas.rev }} --AENEAS_TARBALL_URL=${{ matrix.aeneas.tarball }}
        continue-on-error: true
      - run: earth --ci +verify --AENEAS_REPO=${{ matrix.aeneas.repo }} --AENEAS_REV=${{ matrix.aeneas.rev }} --AENEAS_TARBALL_URL=${{ matrix.aeneas.tarball }}
